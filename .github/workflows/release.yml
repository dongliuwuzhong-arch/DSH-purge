name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'dongliuwuzhong-arch/DSH-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        # 逐个文件列名字会漏：新加的 lib/*.js 不写进来就等于没检查。
        # 改成扫全量，保证 lib/ 与 bin/ 下每个文件都被 --check 过。
        run: |
          set -e
          n=0
          for f in lib/*.js lib/*.mjs bin/*.js client.js; do
            node --check "$f"
            n=$((n+1))
          done
          echo "syntax-checked $n files"
          node --check scripts/assert-patches.mjs
          node --check scripts/assert-soul-guard.mjs
          node --input-type=module -e "import './lib/index.js'"
          node scripts/assert-patches.mjs

      - name: Unit tests
        run: node --test "test/**/*.test.mjs"

      - name: Soul guard
        # 破甲不许改灵魂：注入正文与破甲补丁一旦变化，这道门就红。
        run: node scripts/assert-soul-guard.mjs

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          # 同一版本号再推 main 时不能整个跳过：以前这里直接 exit 0，
          # 结果是代码推到 main、tag 也移动了，Release 里挂的 zip 还是旧包。
          # 现在只跳过「创建」，资产一律重传（--clobber）。
          exists=0
          if gh release view "$tag" >/dev/null 2>&1; then exists=1; fi
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          if [ "$first" != "# ${version}" ]; then
            echo "release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi
          zip="dsh-purge-${version}.zip"
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
            if [ "$exists" = "0" ]; then gh release create "$tag" --title "$tag" --notes-file release-notes.md; fi
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            if [ "$exists" = "0" ]; then gh "${args[@]}"; fi
          fi
          test -s "$zip"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/dongliuwuzhong-arch/DSH-purge/releases/tag/${tag}"
