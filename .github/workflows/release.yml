name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'dongliuwuzhong-arch/DSH-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # actions/checkout@v4 默认不拉 tag。不拉的话下面
          # `git rev-parse refs/tags/vX.Y.Z` 永远为假，永远走 --target 那条路。
          fetch-tags: true

      # 全篇原先没有 setup-node：node 版本 = runner 镜像的默认版本，随镜像漂移。
      # 而 `node --test` 认 glob 是 Node 22 才进 runner 的（A9 首要嫌疑）。
      # 钉死大版本 22，门禁不再取决于跑在哪个镜像上。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 把实际版本打进日志与 Summary：以后排查"换个镜像就红"只需要看这一行。
      - name: Node toolchain
        run: |
          set -euo pipefail
          node -v
          npm -v
          echo "- [x] node $(node -v) / npm $(npm -v)" >> "$GITHUB_STEP_SUMMARY"

      - name: Syntax-check plugin entry
        # 逐个文件列名字会漏：新加的 lib/*.js 不写进来就等于没检查。
        # 改成扫全量，保证 lib/ 与 bin/ 下每个文件都被 --check 过。
        run: |
          # 每步都往 STEP_SUMMARY 写一行：失败时在 Summary 页就能看到跑到哪了，
          # 不用点进 job 展开日志（1.2.1 排查 CI 时就是卡在这一步看不见）。
          mark() { echo "- [x] $1" >> "$GITHUB_STEP_SUMMARY"; }
          fail() { echo "- [ ] **$1**" >> "$GITHUB_STEP_SUMMARY"; echo "::error::$1"; exit 1; }
          echo '## 门禁进度' >> "$GITHUB_STEP_SUMMARY"
          set -euo pipefail
          # bash 默认没有 nullglob：任一 glob 无匹配，字面量 `lib/*.mjs` 会被喂给
          # node --check 然后立刻红，且红得看不出原因。nullglob + 计数断言两头都堵。
          shopt -s nullglob
          files=(lib/*.js lib/*.mjs bin/*.js bin/*.mjs)
          [ "${#files[@]}" -gt 0 ] || fail "lib/ 与 bin/ 下一个文件都没匹配到"
          files+=(client.js)
          for f in "${files[@]}"; do
            node --check "$f" || fail "node --check 失败: $f"
          done
          mark "语法检查 ${#files[@]} 个文件"
          node --check scripts/assert-patches.mjs || fail "node --check assert-patches.mjs"
          node --check scripts/assert-soul-guard.mjs || fail "node --check assert-soul-guard.mjs"
          node --input-type=module -e "import './lib/index.js'" || fail "import lib/index.js 失败"
          mark "import lib/index.js"
          node scripts/assert-patches.mjs || fail "补丁表自检失败"
          mark "补丁表自检"

      - name: Unit tests
        run: |
          set -euo pipefail
          node -v
          # 门禁的 glob 交给 shell 展开（这里不加引号）：Node 收到的是 35 个具体文件，
          # 与 Node 版本无关。原来写成 "test/*.test.mjs"，引号让 shell 不展开，只剩
          # Node 自己的 glob——那是 22+ 才有的，换镜像就红。
          # 也别改成目录参数 `node --test test/`：实测 v24.21/v24.22 上 runner
          # 会把目录当测试文件，直接报 Cannot find module ...\test。
          if ! node --test test/*.test.mjs > gate.log 2>&1; then
            echo '- [ ] **单元测试失败**' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -40 gate.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat gate.log
            echo '::error::单元测试失败'
            exit 1
          fi
          tail -6 gate.log
          echo '- [x] 单元测试' >> "$GITHUB_STEP_SUMMARY"

      - name: Soul guard
        # 破甲不许改灵魂：注入正文与破甲补丁一旦变化，这道门就红。
        run: |
          if ! out=$(node scripts/assert-soul-guard.mjs 2>&1); then
            echo '- [ ] **Soul guard 失败**' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "$out" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Soul guard 失败: $out"
            exit 1
          fi
          echo "$out"
          echo "- [x] Soul guard" >> "$GITHUB_STEP_SUMMARY"

      # Publish 拆成具名步骤：以前是一整块 run，失败时 annotation 只指向
      # 「.github 第 N 行 exit 1」，看不出红在哪一步。拆开后失败会精确落在步骤名上。
      - name: Publish / resolve version
        id: ver
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          first="$(head -n 1 release-notes.md | tr -d '\r')"
          echo "version=$version"
          echo "first=$first"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$first" != "# ${version}" ]; then
            echo "::error::release-notes.md 第一行必须是 # ${version}，现在是: ${first}"
            exit 1
          fi

      - name: Publish / build zip
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          zip="dsh-purge-${version}.zip"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}^{}" >/dev/null 2>&1; then
            commit="$(git rev-parse "refs/tags/${tag}^{}")"
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" "$commit"
          else
            git archive --format=zip --prefix="dsh-purge-${version}/" --output="$zip" HEAD
          fi
          test -s "$zip"
          echo "zip=$(pwd)/$zip  bytes=$(wc -c < "$zip")"
          # 剔掉本机预检基线（台账第 4 条）。zip 是 git archive 打的，
          # package.json 的 files 与 .npmignore 对它无效（那两条只管 npm tarball），
          # 所以必须在产物上直接删条目。下面那道断言负责证明这里真的删干净了。
          cat > "${RUNNER_TEMP:-/tmp}/strip-baseline.py" <<'PY'
          import os, sys, zipfile

          zip_path = sys.argv[1]
          src = zipfile.ZipFile(zip_path)
          bad = [n for n in src.namelist() if n.rsplit("/", 1)[-1] == "preflight-baseline.json"]
          if not bad:
              print("strip: 包里没有 preflight-baseline.json，无需剔除")
              src.close()
              raise SystemExit(0)
          tmp = zip_path + ".strip"
          out = zipfile.ZipFile(tmp, "w", zipfile.ZIP_DEFLATED)
          for item in src.infolist():
              if item.filename in bad:
                  print("strip: 剔除 %s" % item.filename)
                  continue
              info = zipfile.ZipInfo(item.filename, item.date_time)
              info.compress_type = zipfile.ZIP_DEFLATED
              info.external_attr = item.external_attr
              info.create_system = item.create_system
              out.writestr(info, src.read(item.filename))
          out.close()
          src.close()
          os.replace(tmp, zip_path)
          print("strip: 剔除后剩 %d 个条目" % len(zipfile.ZipFile(zip_path).namelist()))
          PY
          python3 "${RUNNER_TEMP:-/tmp}/strip-baseline.py" "$zip"
          test -s "$zip"
          echo "stripped: bytes=$(wc -c < "$zip")"

      # 发布包内容断言：包里只要出现 preflight-baseline.json 就绿不了（台账第 4 条）。
      # 位置卡在 build zip 之后、create/upload 之前——坏包连 release 页都建不出来，
      # 也就不会出现「页面建好、资产是脏的」那种半成品。
      # 顺带把「该有的还在」一起断言：剔文件的手一抖把 scripts/ 整目录删了，这里会红。
      - name: Publish / assert zip content
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          zip="dsh-purge-${version}.zip"
          tmp="${RUNNER_TEMP:-/tmp}"
          test -f "$zip" || { echo "::error::打包产物 $zip 不存在"; exit 1; }
          cat > "$tmp/assert-zip.py" <<'PY'
          import sys, zipfile

          zip_path, prefix = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(zip_path).namelist()
          problems = []

          bad = [n for n in names if n.rsplit("/", 1)[-1] == "preflight-baseline.json"]
          if bad:
              problems.append("包里出现了本机预检基线（不许发）: " + ", ".join(bad))

          required = [
              "package.json",
              "soul-guard.lock",
              "release-notes.md",
              "lib/index.js",
              "bin/dsh-purge.js",
              "scripts/preflight-upgrade.mjs",
              "scripts/install-offline.mjs",
          ]
          missing = [p for p in required if (prefix + p) not in names]
          if missing:
              problems.append("包里缺了该有的文件: " + ", ".join(missing))

          if len(names) < 50:
              problems.append("包里只剩 %d 个条目，像是被打包打薄了" % len(names))

          if problems:
              for p in problems:
                  print("::error::" + p)
              raise SystemExit(1)

          print("包内容断言通过：%d 个条目，无 preflight-baseline.json，关键文件齐全" % len(names))
          PY
          if ! out=$(python3 "$tmp/assert-zip.py" "$zip" "dsh-purge-${version}/" 2>&1); then
            {
              echo '- [ ] **发布包内容断言失败**'
              echo ''
              echo '```'
              echo "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$out"
            exit 1
          fi
          echo "$out"
          echo "- [x] 发布包内容断言" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish / create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # set -e 关掉：gh 失败时要先抓 stderr 报出来，不能被 set -e 直接吞掉。
          set -uo pipefail
          version="${{ steps.ver.outputs.version }}"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"

          # 诊断：这三行会在失败时给出「到底是权限不够还是命令用错」。
          # 1.2.1 之前的版本只报 exit 1，看不出原因。
          echo "repo=${{ github.repository }}"
          echo "token_len=${#GH_TOKEN}"
          gh auth status 2>&1 | sed 's/^/  auth: /' || true

          report_fail() {
            echo "::error::$1"
            {
              echo "### $1"
              echo ''
              echo '```'
              echo "$2"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          if gh release view "$tag" >/dev/null 2>&1; then
            # 已存在也要 edit：1.2.1 首次创建时 --title / --notes-file 没生效，
            # 结果 release 正文是 tag 指向 commit 的 message、而且一个资产都没有。
            # 只跳过 create，不跳过修正。
            echo "release $tag exists; editing title/notes"
            if ! out=$(gh release edit "$tag" --title "$tag" --notes-file release-notes.md 2>&1); then
              report_fail "gh release edit 失败" "$out"
            fi
            echo "$out"
          else
            args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md)
            case "$version" in
              *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
            esac
            echo "running: gh ${args[*]}"
            if ! out=$(gh "${args[@]}" 2>&1); then
              report_fail "gh release create 失败" "$out"
            fi
            echo "$out"
          fi

      # upload 单独一步：它有自己的硬失败语义（upload 静默不落地 = 空壳 release），
      # 所以这里开 set -euo pipefail，并把要传的文件、字节数、sha256 全打进日志。
      - name: Publish / upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"
          echo "tag=$tag"
          echo "zip=$zip"
          test -f "$zip" || { echo "::error::打包产物 $zip 不存在"; exit 1; }
          echo "bytes=$(wc -c < "$zip")"
          sha256sum "$zip" || true
          echo "running: gh release upload $tag $zip --clobber"
          gh release upload "$tag" "$zip" --clobber
          echo "- [x] upload $zip" >> "$GITHUB_STEP_SUMMARY"

      # 空壳 release 不许静默成功：create 成功 + upload 不落地 = 有页面、0 资产。
      # 1.2.1 就是这么废的（83e84e5），1.4.0 / 1.4.1 两次又长得一模一样（A9）。
      - name: Publish / verify asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          tag="v${version}"
          zip="dsh-purge-${version}.zip"
          if ! names="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>&1)"; then
            echo '- [ ] **gh release view --json assets 失败**' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::gh release view $tag --json assets 失败: $names"
            exit 1
          fi
          count=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "  asset: $line"
            count=$((count+1))
          done <<< "$names"
          echo "assets=$count"
          if [ "$count" -lt 1 ]; then
            echo '### 空壳 release：资产 0 个' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$tag 建出来了但资产 0 个——upload 没落地（空壳 release，1.2.1 的指纹）"
            exit 1
          fi
          if ! printf '%s\n' "$names" | grep -qxF "$zip"; then
            echo '### 资产里没有本次的 zip' >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$tag 有 $count 个资产，但没有 $zip"
            exit 1
          fi
          echo "- [x] 资产核对：$count 个，含 $zip" >> "$GITHUB_STEP_SUMMARY"
          echo "published https://github.com/${{ github.repository }}/releases/tag/${tag}"
